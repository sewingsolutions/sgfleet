<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/admin/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/admin/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/admin/apple-touch-icon.png" />
    <link rel="manifest" href="/admin/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SGFleet</title>
    <script>
      (function() {
        var t = localStorage.getItem("theme");
        var r;
        if (t === "dark") r = "dark";
        else if (t === "light") r = "light";
        else r = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", r);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
