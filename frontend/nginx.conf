server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    absolute_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /admin/api/ {
        proxy_pass http://sgfleet-backend:8000/api/;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "";
    }

    location = /admin/login {
        proxy_pass http://sgfleet-backend:8000/login;
        proxy_set_header Connection "";
    }
    location = /admin/logout {
        proxy_pass http://sgfleet-backend:8000/logout;
        proxy_set_header Connection "";
    }

    location /v1/ {
        proxy_pass http://sgfleet-backend:8000/v1/;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location /health {
        proxy_pass http://sgfleet-backend:8000/health;
        proxy_set_header Connection "";
    }
    location = /metrics {
        proxy_pass http://sgfleet-backend:8000/metrics;
        proxy_set_header Connection "";
    }
    location /docs {
        proxy_pass http://sgfleet-backend:8000/docs;
        proxy_set_header Connection "";
    }
    location = /openai_api_schema.json {
        proxy_pass http://sgfleet-backend:8000/openai_api_schema.json;
        proxy_set_header Connection "";
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Serve favicons and static assets referenced from the site root
    location = /favicon.ico { root /usr/share/nginx/html/admin; try_files /favicon.ico =404; access_log off; log_not_found off; }
    location = /favicon.svg { root /usr/share/nginx/html/admin; try_files /favicon.svg =404; access_log off; log_not_found off; }
    location = /favicon-16x16.png { root /usr/share/nginx/html/admin; try_files /favicon-16x16.png =404; access_log off; log_not_found off; }
    location = /favicon-32x32.png { root /usr/share/nginx/html/admin; try_files /favicon-32x32.png =404; access_log off; log_not_found off; }
    location = /apple-touch-icon.png { root /usr/share/nginx/html/admin; try_files /apple-touch-icon.png =404; access_log off; log_not_found off; }
    location = /android-chrome-192x192.png { root /usr/share/nginx/html/admin; try_files /android-chrome-192x192.png =404; access_log off; log_not_found off; }
    location = /android-chrome-512x512.png { root /usr/share/nginx/html/admin; try_files /android-chrome-512x512.png =404; access_log off; log_not_found off; }
    location = /site.webmanifest { root /usr/share/nginx/html/admin; try_files /site.webmanifest =404; access_log off; log_not_found off; }

    # Redirect site root to the admin SPA
    location = / {
        return 301 /admin/;
    }
}
