server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    absolute_redirect off;
    port_in_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Live container log stream (SSE). Needs buffering disabled and long
    # timeouts so the connection isn't dropped during quiet periods of a
    # multi-minute model startup (e.g. while weights load).
    location ~ ^/api/models/.+/logs/stream$ {
        proxy_pass http://sgfleet-backend:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        chunked_transfer_encoding off;
    }

    # Prometheus endpoint is internal-only (scraped by Alloy over the docker network)
    location = /api/metrics {
        return 404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://sgfleet-backend:8000/api/;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "";
    }

    # Login/Logout
    location = /login {
        proxy_pass http://sgfleet-backend:8000/login;
        proxy_set_header Connection "";
    }
    location = /logout {
        proxy_pass http://sgfleet-backend:8000/logout;
        proxy_set_header Connection "";
    }

    # Gateway passthrough
    location /v1/ {
        proxy_pass http://sgfleet-backend:8000/v1/;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location /health {
        proxy_pass http://sgfleet-backend:8000/health;
        proxy_set_header Connection "";
    }
    # Model metrics are internal-only (scraped by Alloy from the model container directly)
    location = /metrics {
        return 404;
    }
    location /docs {
        proxy_pass http://sgfleet-backend:8000/docs;
        proxy_set_header Connection "";
    }
    location = /openai_api_schema.json {
        proxy_pass http://sgfleet-backend:8000/openai_api_schema.json;
        proxy_set_header Connection "";
    }

    # SPA catch-all (admin + user)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
