server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    absolute_redirect off;
    port_in_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # API proxy
    location /api/ {
        proxy_pass http://sgfleet-backend:8000/api/;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "";
    }

    # Login/Logout
    location = /login {
        proxy_pass http://sgfleet-backend:8000/login;
        proxy_set_header Connection "";
    }
    location = /logout {
        proxy_pass http://sgfleet-backend:8000/logout;
        proxy_set_header Connection "";
    }

    # Gateway passthrough
    location /v1/ {
        proxy_pass http://sgfleet-backend:8000/v1/;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location /health {
        proxy_pass http://sgfleet-backend:8000/health;
        proxy_set_header Connection "";
    }
    location = /metrics {
        proxy_pass http://sgfleet-backend:8000/metrics;
        proxy_set_header Connection "";
    }
    location /docs {
        proxy_pass http://sgfleet-backend:8000/docs;
        proxy_set_header Connection "";
    }
    location = /openai_api_schema.json {
        proxy_pass http://sgfleet-backend:8000/openai_api_schema.json;
        proxy_set_header Connection "";
    }

    # SPA catch-all (admin + user)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
