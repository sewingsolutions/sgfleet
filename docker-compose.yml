services:
  admin:
    build: ./admin
    container_name: sgfleet-admin
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    volumes:
      - admin_db:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/opt/compose:ro
      - switch_status:/opt/switch
      - ${MODELS_DIR:-YOUR_MODELS_PATH/vllm_models}:/models:ro
      - ${MODELS_DIR:-YOUR_MODELS_PATH/vllm_models}:/downloads
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
  alloy:
    image: grafana/alloy:latest
    container_name: sgfleet-alloy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./alloy/river.alloy:/etc/alloy/river.alloy:ro
      - alloy_data:/tmp
    environment:
      - PROMETHEUS_HOST=${PROMETHEUS_HOST:-YOUR_PROMETHEUS_HOST}
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/tmp/alloy /etc/alloy/river.alloy
    depends_on:
      - admin
volumes:
  admin_db:
    name: sgfleet_admin_db
  alloy_data:
    name: sgfleet_alloy_data
  switch_status:
    name: sgfleet_switch_status
