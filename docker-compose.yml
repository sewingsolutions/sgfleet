services:
  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_LOG: ${GIT_LOG:-}
    container_name: sgfleet-backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - admin_db:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/opt/compose:ro
      - switch_status:/opt/switch
      - ${MODELS_DIR:-YOUR_MODELS_PATH/vllm_models}:/models:ro
      - ${MODELS_DIR:-YOUR_MODELS_PATH/vllm_models}:/downloads
      - ${LOGS_DIR:-./logs}:/logs
      - ./telemetry/logrotate.conf:/etc/logrotate.d/sgfleet.conf:ro
    environment:
      - SGFLEET_ENCRYPTION_KEY=${SGFLEET_ENCRYPTION_KEY}
      - SGFLEET_BASE_URL=${SGFLEET_BASE_URL:-}
      - HOST_MODELS_DIR=${MODELS_DIR:-YOUR_MODELS_PATH/vllm_models}
      - HOST_LOGS_DIR=${LOGS_DIR:-./logs}

  frontend:
    build: ./frontend
    container_name: sgfleet-frontend
    restart: unless-stopped
    ports:
      - "8000:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

  alloy:
    image: grafana/alloy:latest
    container_name: sgfleet-alloy
    restart: unless-stopped
    profiles:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./telemetry/alloy/generate-config.sh:/usr/local/bin/generate-config.sh:ro
      - alloy_config:/etc/alloy
      - alloy_data:/tmp
    environment:
      - PROMETHEUS_HOST=${PROMETHEUS_HOST:-}
    entrypoint: >
      sh -c "generate-config.sh && exec alloy run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/tmp/alloy /etc/alloy/runtime.alloy"
    depends_on:
      - backend
volumes:
  admin_db:
    name: sgfleet_admin_db
  alloy_config:
    name: sgfleet_alloy_config
  alloy_data:
    name: sgfleet_alloy_data
  switch_status:
    name: sgfleet_switch_status
